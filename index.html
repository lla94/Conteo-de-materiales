<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Conteo de Materiales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font-family:inherit}.app{max-width:620px;margin:auto;padding:16px 13px 125px}
.screen{display:none}.screen.active{display:block}
.welcome{min-height:calc(100vh - 32px);display:flex;align-items:center;justify-content:center}
.welcome-card{width:100%;background:#111827;color:#fff;border-radius:25px;padding:26px 22px;box-shadow:0 12px 35px #00000018}
.logo-title{text-align:center;font-size:29px;font-weight:950;margin:0 0 8px}.logo-sub{text-align:center;color:#cbd5e1;font-size:13px;margin:0 0 28px}
.order-label{display:block;font-size:13px;font-weight:800;color:#e5e7eb;margin-bottom:7px}.order-input{width:100%;border:1px solid #475569;background:#fff;color:#111827;border-radius:13px;padding:14px;font-size:17px;outline:none}
.start-btn{width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px;background:#f97316;color:#fff;font-size:16px;font-weight:950}
.saved-orders{margin-top:20px;background:#fff;color:#111827;border-radius:17px;padding:14px}.saved-title{font-size:13px;font-weight:950;margin-bottom:8px}.saved-empty{font-size:12px;color:#64748b}
.saved-row{border-top:1px solid #e5e7eb;padding:10px 0}.saved-row:first-child{border-top:0}.saved-order-name{font-weight:900;font-size:13px}.saved-order-date{font-size:11px;color:#64748b;margin-top:2px}.saved-order-total{font-weight:950;margin-top:4px}
.head{background:#111827;color:#fff;border-radius:22px;padding:20px;margin-bottom:12px;text-align:center}.head h1{margin:0;font-size:24px;font-weight:950}.order-pill{display:inline-block;margin-top:9px;background:#334155;color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:15px;padding:4px;margin-bottom:12px}.tab{padding:10px;border:0;background:none;border-radius:11px;font-weight:900;color:#64748b}.tab.active{background:#111827;color:#fff}
.view{display:none}.view.active{display:block}.notice{background:#eef2ff;color:#3730a3;border-radius:13px;padding:11px;font-size:12px;margin-bottom:12px}
.family{background:#fff;border-radius:17px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 10px #0000000b}.family-head{width:100%;border:0;background:#fff;padding:15px 15px;display:flex;align-items:center;justify-content:space-between;text-align:left}.family-name{font-size:15px;font-weight:950}.family-count{font-size:11px;color:#64748b;margin-top:3px}.chev{font-size:18px;color:#64748b;font-weight:900}
.family-body{padding:0 10px 10px}.family.closed .family-body{display:none}.family.closed .chev{transform:rotate(-90deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mat-card{border:1px solid #e5e7eb;border-radius:14px;padding:11px;background:#fff;min-width:0}.mat-name{font-size:13px;font-weight:950;line-height:1.15;min-height:30px}.price{font-size:10px;color:#64748b;margin-top:3px}.subtotal{font-size:11px;font-weight:950;margin-top:8px}.subtotal small{font-size:9px;color:#94a3b8;margin-right:3px}
.price-edit{margin-top:7px}.price-input{width:100%;padding:7px 8px;border:1px solid #d1d5db;border-radius:9px;font-size:13px}
.counter{display:grid;grid-template-columns:40px 1fr 40px;gap:6px;align-items:center;margin-top:9px}.counter button{height:39px;border:0;border-radius:11px;font-size:21px;font-weight:800;background:#e5e7eb;color:#111827}.counter button.plus{background:#111827;color:#fff}.count{text-align:center;font-size:21px;font-weight:950}
.total-items{font-size:11px;color:#64748b;margin-top:8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -6px 24px #00000018;padding:10px max(13px,calc((100vw - 620px)/2 + 13px));z-index:10}
.total{display:flex;justify-content:space-between;align-items:center}.total span{font-size:10px;color:#64748b}.total strong{font-size:22px}.buttons{display:flex;gap:7px;margin-top:8px}.btn{flex:1;border:0;border-radius:11px;padding:10px;font-weight:950}.dark{background:#111827;color:#fff}.light{background:#e5e7eb;color:#111827}.orange{background:#f97316;color:#fff}
.finish{width:100%;margin-top:10px;border:0;border-radius:13px;padding:13px;background:#f97316;color:#fff;font-weight:950}
.history{padding:14px;border-left:4px solid #111827}.muted{color:#64748b;font-size:12px}.h-total{font-size:19px;font-weight:950;margin-top:3px}.summary-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin:7px 0}.summary-row b{font-weight:950}.empty{text-align:center;color:#64748b;padding:35px 10px}
.search{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;margin-bottom:10px;font-size:14px;background:#fff}.filterbar{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.filter{white-space:nowrap;border:0;background:#e5e7eb;color:#334155;padding:9px 12px;border-radius:999px;font-size:11px;font-weight:900}.filter.active{background:#111827;color:#fff}
</style>
</head>
<body>
<div class="app">

<section id="home" class="screen active">
<div class="welcome"><div class="welcome-card">
<h1 class="logo-title">Conteo de Materiales</h1>
<p class="logo-sub">Control de materiales por pedido</p>
<label class="order-label" for="orderName">Nombre del pedido / venta</label>
<input id="orderName" class="order-input" type="text" placeholder="Ej. Pedido 0001" autocomplete="off">
<button class="start-btn onclick" onclick="startSale()">Iniciar venta</button>
<div class="saved-orders"><div class="saved-title">Ventas finalizadas</div><div id="homeHistory"></div></div>
</div></div>
</section>

<section id="appScreen" class="screen">
<div class="head"><h1>Conteo de Materiales</h1><div class="order-pill" id="currentOrder">Pedido</div></div>
<div class="tabs"><button class="tab active" data-v="count">Conteo</button><button class="tab" data-v="history">Historial</button></div>

<section id="count" class="view active">
<div class="notice">Selecciona una familia para ver sus referencias. Cada referencia permite ajustar su valor y contar con <b>+</b> y <b>−</b>.</div>
<input id="search" class="search" placeholder="Buscar referencia..." oninput="renderFamilies()">
<div class="filterbar" id="filters"></div>
<div id="families"></div>
<button class="finish" onclick="finishSale()">Terminar conteo y finalizar venta</button>
</section>

<section id="history" class="view"><div id="hist"></div></section>
</section>


<div id="summaryOverlay" style="display:none;position:fixed;inset:0;background:#f4f5f7;z-index:30;overflow:auto">
  <div style="max-width:620px;margin:auto;padding:18px 13px 35px">
    <button class="back" onclick="closeSummary()">← Volver</button>
    <div class="head">
      <h1>Resumen de venta</h1>
      <div class="order-pill" id="summaryOrder">Pedido</div>
    </div>
    <div class="card">
      <div class="muted" id="summaryDate"></div>
      <div id="summaryItems" style="margin-top:12px"></div>
      <div style="border-top:1px solid #cbd5e1;margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;font-size:18px;font-weight:950">
        <span>TOTAL PEDIDO</span><span id="summaryTotal"></span>
      </div>
    </div>
    <button class="finish" onclick="downloadCurrentSummaryPDF()">Descargar PDF</button>
  </div>
</div>

<div class="bottom" id="bottomBar" style="display:none">
<div class="total"><span>TOTAL DEL PEDIDO</span><strong id="grand">$0</strong></div>
<div class="buttons"><button class="btn light" onclick="resetAll()">Reiniciar cantidades</button></div>
</div>
</div>

<script>
const raw=[
["Tablex 15 ST",80000,"Tablex 15"],["Tablex 15 RH",80000,"Tablex 15"],["Tablex 15 ST laminado 1C",80000,"Tablex 15"],["Tablex 15 ST laminado 2C",80000,"Tablex 15"],["Tablex 15 RH laminado 1C",80000,"Tablex 15"],["Tablex 15 RH laminado 2C",80000,"Tablex 15"],
["Tablex 18 ST",80000,"Tablex 18"],["Tablex 18 RH",80000,"Tablex 18"],["Tablex 18 ST laminado 1C",80000,"Tablex 18"],["Tablex 18 ST laminado 2C",80000,"Tablex 18"],["Tablex 18 RH laminado 1C",80000,"Tablex 18"],["Tablex 18 RH laminado 2C",80000,"Tablex 18"],
["Tablex 20 - 36 ST",80000,"Tablex 20 - 36"],["Tablex 20 - 36 RH",80000,"Tablex 20 - 36"],["Tablex 20 - 36 ST laminado",80000,"Tablex 20 - 36"],["Tablex 20 - 36 RH laminado",80000,"Tablex 20 - 36"],
["MDF 9 Liso",55000,"MDF"],["MDF 9 Pelo",40000,"MDF"],["MDF 12 Liso",65000,"MDF"],["MDF 12 Pelo",50000,"MDF"],["MDF 18 Liso",90000,"MDF"],["MDF 18 Liso RH",100000,"MDF"],["MDF 18 Pelo",60000,"MDF"],
["Fondos ST",35000,"Fondos"],["Fondos RH",35000,"Fondos"],["Fondos laminados",70000,"Fondos"]
];
let mats=JSON.parse(localStorage.getItem("mats_v4")||"null");
if(!mats){mats=raw.map(x=>({name:x[0],price:x[1],family:x[2]}));localStorage.setItem("mats_v4",JSON.stringify(mats));}
let qty=Array(mats.length).fill(0),currentOrder="",sales=JSON.parse(localStorage.getItem("sales_v4")||"[]"),openFamilies={};
const money=n=>"$"+Math.round(n||0).toLocaleString("es-CO");
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
function startSale(){let n=document.getElementById("orderName").value.trim();if(!n){alert("Escribe el nombre del pedido, por ejemplo: Pedido 0001.");return}currentOrder=n;qty=Array(mats.length).fill(0);localStorage.setItem("current_order_v4",n);localStorage.setItem("qty_v4",JSON.stringify(qty));document.getElementById("currentOrder").textContent=n;document.getElementById("bottomBar").style.display="block";showScreen("appScreen");renderFamilies();renderHist()}
function goHome(){if(confirm("¿Salir del pedido actual sin finalizarlo? El conteo actual se perderá.")){currentOrder="";qty=Array(mats.length).fill(0);localStorage.removeItem("current_order_v4");localStorage.removeItem("qty_v4");document.getElementById("bottomBar").style.display="none";showScreen("home");renderHomeHistory()}}
function families(){return [...new Set(mats.map(m=>m.family))]}
function renderFilters(){let e=document.getElementById("filters");e.innerHTML="";["TODOS",...families()].forEach((f,i)=>{let b=document.createElement("button");b.className="filter"+(i===0?" active":"");b.textContent=f;b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderFamilies(f)};e.appendChild(b)})}
let selectedFamily="TODOS";
function renderFamilies(forceFamily=null){
if(forceFamily!==null)selectedFamily=forceFamily;
let search=(document.getElementById("search")?.value||"").toLowerCase().trim(),e=document.getElementById("families");e.innerHTML="";
let fs=selectedFamily==="TODOS"?families():[selectedFamily];
fs.forEach(f=>{
 let indices=mats.map((m,i)=>m.family===f&&(!search||m.name.toLowerCase().includes(search))?i:-1).filter(i=>i>=0);
 if(!indices.length)return;
 let fam=document.createElement("div");fam.className="family"+(openFamilies[f]===false?" closed":"");
 let totalUnits=indices.reduce((a,i)=>a+(qty[i]||0),0);
 fam.innerHTML=`<button class="family-head" onclick="toggleFamily('${f.replaceAll("'","\\'")}')"><div><div class="family-name">${f}</div><div class="family-count">${indices.length} referencias · ${totalUnits} unidades contadas</div></div><div class="chev">⌄</div></button><div class="family-body"><div class="grid" id="grid-${f.replaceAll(" ","-")}"></div></div>`;
 e.appendChild(fam);
 let grid=fam.querySelector(".grid");
 indices.forEach(i=>{
  let m=mats[i],c=document.createElement("div");c.className="mat-card";
  c.innerHTML=`<div class="mat-name">${m.name}</div><div class="price">Base: ${money(m.price)}</div><div class="price-edit"><input class="price-input" type="number" min="0" step="1000" value="${m.price}" onchange="changePrice(${i},this.value)"></div><div class="subtotal"><small>SUBTOTAL</small><span id="s${i}">${money((qty[i]||0)*m.price)}</span></div><div class="counter"><button onclick="change(${i},-1)">−</button><div class="count" id="q${i}">${qty[i]||0}</div><button class="plus" onclick="change(${i},1)">+</button></div>`;
  grid.appendChild(c);
 });
});
calc();renderFilters();
}
function toggleFamily(f){openFamilies[f]=openFamilies[f]===false?true:false;renderFamilies()}
function change(i,d){qty[i]=Math.max(0,(qty[i]||0)+d);localStorage.setItem("qty_v4",JSON.stringify(qty));renderFamilies()}
function changePrice(i,v){let n=parseFloat(v);if(!Number.isFinite(n)||n<0)n=0;mats[i].price=Math.round(n);localStorage.setItem("mats_v4",JSON.stringify(mats));renderFamilies()}
function calc(){let total=0;mats.forEach((m,i)=>{total+=(qty[i]||0)*(m.price||0)});document.getElementById("grand").textContent=money(total);return total}
function resetAll(){if(confirm("¿Reiniciar todas las cantidades de este pedido?")){qty=Array(mats.length).fill(0);localStorage.setItem("qty_v4",JSON.stringify(qty));renderFamilies()}}
function generatePDF(saleOverride=null){
let order=saleOverride?saleOverride.order:currentOrder;
let items=saleOverride?saleOverride.items:mats.map((m,i)=>({name:m.name,price:m.price,qty:qty[i]||0,total:(qty[i]||0)*m.price})).filter(x=>x.qty>0);
if(!order){alert("No hay un pedido para generar.");return}
if(!items.length){alert("No hay referencias con cantidades para generar el PDF.");return}
const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
let y=18,total=items.reduce((a,x)=>a+x.total,0);
doc.setFillColor(17,24,39);doc.roundedRect(14,12,182,28,5,5,"F");
doc.setTextColor(255,255,255);doc.setFontSize(19);doc.setFont(undefined,"bold");doc.text("CONTEO DE MATERIALES",105,24,{align:"center"});
doc.setFontSize(11);doc.setFont(undefined,"normal");doc.text(order,105,32,{align:"center"});
doc.setTextColor(17,24,39);doc.setFontSize(10);doc.text("Resumen del pedido",14,48);
doc.setTextColor(100,116,139);doc.text("Fecha: "+(saleOverride?saleOverride.date:new Date().toLocaleString("es-CO")),14,54);
y=64;doc.setFillColor(241,245,249);doc.roundedRect(14,y-6,182,10,2,2,"F");
doc.setTextColor(51,65,85);doc.setFont(undefined,"bold");doc.text("REFERENCIA",17,y);doc.text("CANT.",128,y,{align:"right"});doc.text("V. UNIT.",160,y,{align:"right"});doc.text("TOTAL",193,y,{align:"right"});
y+=9;doc.setFont(undefined,"normal");doc.setTextColor(17,24,39);
items.forEach(x=>{
 if(y>270){doc.addPage();y=18}
 let name=x.name; if(name.length>38) name=name.slice(0,35)+"...";
 doc.text(name,17,y);doc.text(String(x.qty),128,y,{align:"right"});doc.text(money(x.price),160,y,{align:"right"});doc.text(money(x.total),193,y,{align:"right"});y+=7;
});
doc.setDrawColor(203,213,225);doc.line(14,y,196,y);y+=9;
doc.setFont(undefined,"bold");doc.setFontSize(13);doc.text("TOTAL PEDIDO",150,y,{align:"right"});doc.text(money(total),193,y,{align:"right"});
doc.setFont(undefined,"normal");doc.setFontSize(9);doc.setTextColor(100,116,139);doc.text("Documento generado por Conteo de Materiales",14,287);
doc.save(order.replace(/[^a-z0-9]+/gi,"_")+"_Resumen.pdf");
}
function finishSale(){let items=mats.map((m,i)=>({name:m.name,price:m.price,qty:qty[i]||0,total:(qty[i]||0)*m.price})).filter(x=>x.qty>0);if(!currentOrder){alert("No hay un pedido activo.");return}if(!items.length){alert("Todavía no hay unidades contadas.");return}let total=items.reduce((a,x)=>a+x.total,0);sales.unshift({id:Date.now(),order:currentOrder,date:new Date().toLocaleString("es-CO"),items,total});sales=sales.slice(0,100);localStorage.setItem("sales_v4",JSON.stringify(sales));currentOrder="";qty=Array(mats.length).fill(0);localStorage.removeItem("current_order_v4");localStorage.removeItem("qty_v4");document.getElementById("bottomBar").style.display="none";alert("Venta finalizada y guardada correctamente.");document.getElementById("orderName").value="";showScreen("home");renderHomeHistory()}
function renderHist(){let e=document.getElementById("hist");e.innerHTML="";if(!sales.length){e.innerHTML='<div class="card empty">No hay ventas finalizadas.</div>';return}sales.forEach((s,i)=>{let c=document.createElement("div");c.className="card history";c.innerHTML=`<div class="muted">${s.date}</div><div style="font-size:16px;font-weight:950;margin-top:3px">${s.order}</div><div class="h-total">${money(s.total)}</div><div style="margin-top:10px">${s.items.map(x=>`<div class="summary-row"><span>${x.name} × ${x.qty}<br><span class="muted">${money(x.price)} / unidad</span></span><b>${money(x.total)}</b></div>`).join("")}</div><div style="display:flex;gap:7px;margin-top:8px"><button class="btn dark" style="flex:1" onclick="viewSale(${i})">Ver resumen</button><button class="btn light" style="flex:1" onclick="delSale(${i})">Eliminar</button></div>`;e.appendChild(c)})}
function renderHomeHistory(){let e=document.getElementById("homeHistory");e.innerHTML="";if(!sales.length){e.innerHTML='<div class="saved-empty">Todavía no hay ventas finalizadas.</div>';return}sales.slice(0,8).forEach((s,i)=>{let d=document.createElement("div");d.className="saved-row";d.innerHTML=`<div class="saved-order-name">${s.order}</div><div class="saved-order-date">${s.date}</div><div class="saved-order-total">${money(s.total)}</div><button class="btn dark" style="width:100%;margin-top:8px" onclick="viewSale(${i})">Ver resumen</button>`;e.appendChild(d)})}

let selectedSale=null;
function viewSale(index){
  selectedSale=sales[index];
  document.getElementById("summaryOrder").textContent=selectedSale.order;
  document.getElementById("summaryDate").textContent=selectedSale.date;
  document.getElementById("summaryTotal").textContent=money(selectedSale.total);
  let box=document.getElementById("summaryItems"); box.innerHTML="";
  selectedSale.items.forEach(x=>{
    let row=document.createElement("div");row.className="summary-row";
    row.innerHTML=`<span><b>${x.name}</b><br><span class="muted">${x.qty} unidad(es) × ${money(x.price)}</span></span><b>${money(x.total)}</b>`;
    box.appendChild(row);
  });
  document.getElementById("summaryOverlay").style.display="block";
}
function closeSummary(){document.getElementById("summaryOverlay").style.display="none";selectedSale=null}
function downloadCurrentSummaryPDF(){if(selectedSale)generatePDF(selectedSale)}

function delSale(i){if(confirm("¿Eliminar esta venta del historial?")){sales.splice(i,1);localStorage.setItem("sales_v4",JSON.stringify(sales));renderHist();renderHomeHistory()}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.v).classList.add("active");renderHist()});
renderHomeHistory();renderFilters();
</script>
</body>
</html>
