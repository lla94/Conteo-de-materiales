<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Conteo de Materiales</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;padding:16px 14px 105px}.head{background:#111827;color:white;border-radius:22px;padding:20px;margin-bottom:12px}
.head h1{margin:0;font-size:23px}.head p{margin:5px 0 0;color:#cbd5e1;font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:15px;padding:4px;margin-bottom:12px}.tab{padding:10px;border:0;background:none;border-radius:11px;font-weight:800;color:#64748b}.tab.active{background:#111827;color:white}
.view{display:none}.view.active{display:block}.card{background:white;border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:0 2px 10px #0000000b}
.top{display:flex;justify-content:space-between;gap:12px}.name{font-size:16px;font-weight:900}.price{font-size:12px;color:#64748b;margin-top:4px}.subtotal{text-align:right;font-weight:900}.subtotal small{display:block;font-size:10px;color:#94a3b8;margin-bottom:2px}
.counter{display:grid;grid-template-columns:58px 1fr 58px;gap:10px;align-items:center;margin-top:15px}.counter button{height:50px;border:0;border-radius:15px;font-size:27px;font-weight:700;background:#e5e7eb;color:#111827}.counter button.plus{background:#111827;color:#fff}.count{text-align:center;font-size:28px;font-weight:900}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;box-shadow:0 -6px 24px #00000018;padding:13px max(14px,calc((100vw - 560px)/2 + 14px));z-index:10}.total{display:flex;justify-content:space-between;align-items:center}.total span{font-size:11px;color:#64748b}.total strong{font-size:25px}.buttons{display:flex;gap:8px;margin-top:9px}.btn{flex:1;border:0;border-radius:12px;padding:11px;font-weight:900}.dark{background:#111827;color:#fff}.light{background:#e5e7eb;color:#111827}
.notice{background:#fff7ed;color:#9a3412;border-radius:13px;padding:12px;font-size:12px;margin-bottom:12px}.history{padding:14px;border-left:4px solid #111827}.muted{color:#64748b;font-size:12px}.h-total{font-size:19px;font-weight:900;margin-top:3px}.empty{text-align:center;color:#64748b;padding:35px 10px}
.price-row{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center}.price-row input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:11px;font-size:16px}
</style>
</head>
<body>
<div class="app">
<div class="head"><h1>Conteo de Materiales</h1><p>Cuenta unidad por unidad con + y −</p></div>
<div class="tabs"><button class="tab active" data-v="count">Conteo</button><button class="tab" data-v="history">Historial</button></div>

<section id="count" class="view active">
<div class="notice">Cada toque en <b>+</b> suma una unidad. Cada toque en <b>−</b> descuenta una unidad.</div>
<div id="list"></div>
<div class="buttons"><button class="btn light" onclick="resetAll()">Reiniciar conteo</button><button class="btn dark" onclick="saveCount()">Guardar conteo</button></div>
</section>

<section id="history" class="view"><div id="hist"></div></section>
</div>

<div class="bottom"><div class="total"><span>TOTAL GENERAL</span><strong id="grand">$0</strong></div></div>

<script>
const defaults=[
["Tablex ST",80000],["MDF 9 Liso",55000],["MDF 9 Pelo",40000],["MDF 12 Liso",65000],["MDF 12 Pelo",50000],
["MDF 18 Liso",90000],["MDF 18 Liso RH",100000],["MDF 18 Pelo",60000],["Fondos - Estado 1",60000],["Fondos - Estado 2",70000]
];
let mats=JSON.parse(localStorage.getItem("mats_v2")||"null")||defaults.map(x=>({name:x[0],price:x[1]}));
let qty=JSON.parse(localStorage.getItem("qty_v2")||"null")||Array(mats.length).fill(0);
let hist=JSON.parse(localStorage.getItem("hist_v2")||"[]");

const money=n=>"$"+Math.round(n).toLocaleString("es-CO");
function render(){
 const list=document.getElementById("list");list.innerHTML="";
 mats.forEach((m,i)=>{
  const c=document.createElement("div");c.className="card";
  c.innerHTML=`<div class="top"><div><div class="name">${m.name}</div><div class="price">${money(m.price)} / unidad</div></div><div class="subtotal"><small>SUBTOTAL</small><span id="s${i}">${money(0)}</span></div></div>
  <div class="counter"><button onclick="change(${i},-1)">−</button><div class="count" id="q${i}">${qty[i]||0}</div><button class="plus" onclick="change(${i},1)">+</button></div>`;
  list.appendChild(c);
 });calc();
}
function change(i,d){qty[i]=Math.max(0,(qty[i]||0)+d);localStorage.setItem("qty_v2",JSON.stringify(qty));calc()}
function calc(){let total=0;mats.forEach((m,i)=>{let s=(qty[i]||0)*m.price;total+=s;let e=document.getElementById("s"+i);let q=document.getElementById("q"+i);if(e)e.textContent=money(s);if(q)q.textContent=qty[i]||0});document.getElementById("grand").textContent=money(total);return total}
function resetAll(){if(confirm("¿Reiniciar todas las cantidades?")){qty=Array(mats.length).fill(0);localStorage.setItem("qty_v2",JSON.stringify(qty));render()}}
function saveCount(){let items=mats.map((m,i)=>({name:m.name,price:m.price,qty:qty[i]||0,total:(qty[i]||0)*m.price})).filter(x=>x.qty>0);if(!items.length){alert("Todavía no hay unidades contadas.");return}let total=items.reduce((a,x)=>a+x.total,0);hist.unshift({date:new Date().toLocaleString("es-CO"),items,total});hist=hist.slice(0,50);localStorage.setItem("hist_v2",JSON.stringify(hist));alert("Conteo guardado.");renderHist()}
function renderHist(){let e=document.getElementById("hist");e.innerHTML="";if(!hist.length){e.innerHTML='<div class="card empty">No hay conteos guardados.</div>';return}hist.forEach((h,i)=>{let c=document.createElement("div");c.className="card history";c.innerHTML=`<div class="muted">${h.date}</div><div class="h-total">${money(h.total)}</div><div style="margin-top:10px">${h.items.map(x=>`<div style="display:flex;justify-content:space-between;font-size:12px;margin:6px 0"><span>${x.name} × ${x.qty}</span><b>${money(x.total)}</b></div>`).join("")}</div><button class="btn light" style="margin-top:8px;width:100%" onclick="delHist(${i})">Eliminar</button>`;e.appendChild(c)})}
function delHist(i){hist.splice(i,1);localStorage.setItem("hist_v2",JSON.stringify(hist));renderHist()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.v).classList.add("active");renderHist()});
render();renderHist();
</script>
</body></html>
